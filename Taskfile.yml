# go-task — wspólne komendy na Windows / Linux / macOS
# https://taskfile.dev
#
# Instalacja: https://taskfile.dev/installation/
# Lista:      task --list

version: "3"

vars:
  # Na Windowsie binarka ma rozszerzenie .exe; na Unixie puste.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  KLIN_BIN: build/klin{{.EXE}}

tasks:
  default:
    desc: lista komend
    cmds:
      - task --list

  get:
    desc: pobierz zależności Dart
    run: once
    cmds:
      - dart pub get

  analyze:
    desc: analiza statyczna
    deps: [get]
    cmds:
      - dart analyze

  test:
    desc: testy złote
    deps: [get]
    cmds:
      - dart test

  check:
    desc: analyze + test
    deps:
      - analyze
      - test

  hello:
    desc: pełny przelot hello.kl → C → uruchomienie
    deps: [get]
    cmds:
      - dart run bin/klin.dart hello.kl

  run:
    desc: "kompiluj i uruchom plik .kl (task run -- ścieżka.kl)"
    deps: [get]
    cmds:
      - dart run bin/klin.dart {{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  release:
    desc: samodzielna binarka kompilatora (build/klin[.exe])
    deps: [get]
    cmds:
      - dart compile exe bin/klin.dart -o {{.KLIN_BIN}}
    generates:
      - "{{.KLIN_BIN}}"

  clean:
    desc: usuń out/ i binarkę release
    cmds:
      - cmd: rm -rf out "{{.KLIN_BIN}}"
        platforms: [linux, darwin]
      - cmd: cmd /c "if exist out rmdir /s /q out & if exist {{.KLIN_BIN}} del /f /q {{.KLIN_BIN}}"
        platforms: [windows]
